services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eaglecode
      POSTGRES_USER: eaglecode
      POSTGRES_PASSWORD: eaglecode
    ports:
      - "5433:5432"
    volumes:
      - eaglecode_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaglecode -d eaglecode"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eaglecode_postgres:
