[project]
name = "eaglecode-backend"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
  "Django~=5.2.0",
  "djangorestframework~=3.16.0",
  "djangorestframework-simplejwt~=5.5.0",
  "django-cors-headers~=4.7.0",
  "drf-spectacular~=0.28.0",
  "psycopg[binary]~=3.2.0",
  "gunicorn~=23.0.0",
  "python-dotenv~=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest~=8.3", "pytest-django~=4.10", "ruff~=0.9"]

# A Django project, not a distributable library: name the packages explicitly so
# setuptools does not refuse the flat layout it cannot infer.
[tool.setuptools]
packages = ["apps", "common", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
